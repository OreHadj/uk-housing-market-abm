# Author: Max Stoddard
name: Windows Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release-source:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.source-metadata.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: source-metadata
        name: Resolve source metadata
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove Windows-incompatible supporting data
        run: rm -rf src/main/resources/supporting-data

      - name: Upload sanitized release source
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-source-${{ github.run_id }}
          path: |
            .dockerignore
            .github/workflows/windows-release.yml
            .gitignore
            .mvn
            AGENTS.md
            README.md
            dashboard
            docs
            input-data-versions
            scripts
            src
            mvnw
            mvnw.cmd
            pom.xml
            run-dashboard.sh
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-windows-release:
    needs: prepare-release-source
    runs-on: windows-2022
    env:
      RELEASE_GIT_COMMIT: ${{ needs.prepare-release-source.outputs.commit_sha }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download sanitized release source
        uses: actions/download-artifact@v4
        with:
          name: windows-release-source-${{ github.run_id }}
          path: .

      - id: release-metadata
        name: Resolve release metadata
        run: |
          $package = Get-Content -Raw -Path dashboard/package.json | ConvertFrom-Json
          $version = [string]$package.version
          $expectedTag = "v$version"
          $installerName = "UK-Housing-Model-$version-Setup.exe"

          "app_version=$version" >> $env:GITHUB_OUTPUT
          "expected_tag=$expectedTag" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $expectedTag) {
            Write-Error "Release tag ${{ github.ref_name }} does not match dashboard package version $expectedTag."
            exit 1
          }

      - id: signing-mode
        name: Resolve Windows signing mode
        env:
          HAS_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          $missing = @()
          if ($env:HAS_WIN_CSC_LINK -ne "true") {
            $missing += "WIN_CSC_LINK"
          }
          if ($env:HAS_WIN_CSC_KEY_PASSWORD -ne "true") {
            $missing += "WIN_CSC_KEY_PASSWORD"
          }

          if ($missing.Count -eq 0) {
            "signing_mode=signed" >> $env:GITHUB_OUTPUT
            "unsigned_reason=" >> $env:GITHUB_OUTPUT
            "Windows installer signing mode: signed."
            exit 0
          }

          $reason = "Missing GitHub secret(s): $($missing -join ', ')"
          Write-Warning "$reason; building and publishing an unsigned Windows installer."
          "signing_mode=unsigned" >> $env:GITHUB_OUTPUT
          "unsigned_reason=$reason" >> $env:GITHUB_OUTPUT
          "### Windows installer signing" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "$reason. The workflow will continue with an unsigned installer and mark the release metadata accordingly." >> $env:GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            dashboard/electron/package-lock.json

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --include=dev

      - name: Install Electron dependencies
        working-directory: dashboard
        run: npm --prefix electron ci

      - name: Installer configuration and test helpers
        run: |
          node scripts/windows/write-installer-release-manifest.mjs --config-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows/tests/installer.test.mjs

      - name: Installer directory hook regression
        run: node scripts/windows/test-installer-directory-hook.mjs

      - name: Dashboard lint
        working-directory: dashboard
        run: npm run lint

      - name: Dashboard build
        working-directory: dashboard
        run: npm run build

      - name: Dashboard smoke tests
        working-directory: dashboard
        run: npm run test:smoke

      - name: Maven tests
        run: .\mvnw.cmd test

      - name: Build Windows release fat jar
        run: .\mvnw.cmd -q -DskipTests -Pwindows-release-fat-jar package

      - name: Maven vs packaged launcher regression
        working-directory: dashboard
        run: npm run test:release-launch

      - name: Build signed Windows installer
        if: steps.signing-mode.outputs.signing_mode == 'signed'
        working-directory: dashboard
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release:installer:signed

      - name: Build unsigned Windows installer
        if: steps.signing-mode.outputs.signing_mode == 'unsigned'
        working-directory: dashboard
        env:
          INSTALLER_UNSIGNED_REASON: ${{ steps.signing-mode.outputs.unsigned_reason }}
        run: npm run release:installer:unsigned

      - name: Validate installer release metadata
        working-directory: dashboard
        run: npm run "release:installer:check:${{ steps.signing-mode.outputs.signing_mode }}"

      - name: Installed app smoke test
        working-directory: dashboard
        run: npm run test:windows-installed-installer

      - name: Installed app in a custom folder with spaces
        working-directory: dashboard
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'UK Housing installer path spaces\UK Housing Model'
          npm run test:windows-installed-installer -- --install-dir "$installDir"

      - name: Installed app in a custom folder with accented characters
        working-directory: dashboard
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'UK Housing modèle José\UK Housing Model'
          npm run test:windows-installed-installer -- --install-dir "$installDir"

      - id: installer-artifacts
        name: Detect installer artifacts
        if: always()
        run: |
          $artifactRoot = "dashboard/release/windows/installer"
          $hasArtifacts = (Test-Path $artifactRoot) -and (Get-ChildItem -Path $artifactRoot -File -Recurse | Select-Object -First 1)
          if ($hasArtifacts) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Windows release workflow artifact
        if: always() && steps.installer-artifacts.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets-${{ github.run_id }}
          path: dashboard/release/windows/installer/**
          if-no-files-found: error
          retention-days: 14

      - id: release-notes
        name: Write GitHub Release notes
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          $installerName = "${{ steps.release-metadata.outputs.installer_name }}"
          $signingMode = "${{ steps.signing-mode.outputs.signing_mode }}"
          $unsignedReason = "${{ steps.signing-mode.outputs.unsigned_reason }}"

          if ($signingMode -eq "signed") {
            $signingParagraph = "This release contains a code-signed Electron app for Windows, the packaged Java model, bundled runtime resources, release data, a release manifest, and SHA256 checksum files."
          } else {
            $signingParagraph = "This release contains an unsigned Electron app for Windows, the packaged Java model, bundled runtime resources, release data, a release manifest, and SHA256 checksum files. The installer was not code-signed because ${unsignedReason}; Windows may show additional trust prompts."
          }

          $body = @"
          UK Housing Model ${{ github.ref_name }} packages the model as a user-friendly Windows desktop app.

          $signingParagraph

          Installation on Windows:

          1. Download '$installerName' from the assets below.
          2. Optionally verify the download checksum with PowerShell:

          ~~~powershell
          Get-FileHash .\$installerName -Algorithm SHA256
          ~~~

          3. Compare the result with 'SHA256SUMS.txt' or '$installerName.sha256'.
          4. Run the installer. **Only for me** is selected by default; **Anyone who uses this computer** requires administrator permissions.
          5. Keep the suggested application folder or choose another writable location, then complete setup.
          6. Launch **UK Housing Model** from the Start Menu or desktop shortcut.

          Upgrades reuse the existing application folder unless you choose a different destination. Results, logs, and generated configurations remain in the current user's AppData\Roaming\UK Housing Model folder. Selecting an application folder does not move these files, and normal uninstall preserves them.

          The release workflow runs dashboard linting, dashboard build checks, smoke tests, Maven tests, and the packaged-launcher regression before publishing these assets.
          "@

          $notesPath = "windows-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $body -Encoding UTF8
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Publish draft GitHub Release
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UK Housing Model ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: ${{ steps.release-notes.outputs.path }}
          files: |
            dashboard/release/windows/installer/${{ steps.release-metadata.outputs.installer_name }}
            dashboard/release/windows/installer/release-manifest.json
            dashboard/release/windows/installer/SHA256SUMS.txt
            dashboard/release/windows/installer/${{ steps.release-metadata.outputs.installer_name }}.sha256
